<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin | American Home Goods</title>
<meta name="theme-color" content="#10233d">
<link rel="icon" href="../assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#10233d;--navy2:#183154;--cream:#f4efe6;--card:#fff;--ink:#171714;--muted:#5c5a56;--line:rgba(16,35,61,.14);--brick:#c8202b;--gold:#c4a15a;--wa:#128c4b;--ok:#1f6b3a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;font-size:16px;line-height:1.45;padding-bottom:60px}
h1,h2,h3{font-family:"Barlow Condensed",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.03em;color:var(--navy);line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:none}a{color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:10px 0}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:"Barlow Condensed";font-weight:700;font-size:1.3rem;letter-spacing:.05em;line-height:1}.brand small{display:block;font-family:"Source Sans 3";font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-top:3px}
.btn{background:var(--navy);color:#fff;padding:12px 18px;border-radius:999px;font-weight:700;font-size:.95rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-height:44px}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.sm{padding:7px 12px;font-size:.82rem;min-height:36px}.btn.danger{background:var(--brick)}.btn.ok{background:var(--ok)}.btn.gold{background:var(--gold);color:var(--navy)}
header .btn.sec{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.btn[disabled]{opacity:.5;pointer-events:none}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0;margin-bottom:6px}
.tab{flex:0 0 auto;background:#fff;border:1px solid var(--line);color:var(--navy);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.92rem}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);padding:10px 12px;border-radius:10px}.stat b{display:block;font-size:1.4rem;font-family:"Barlow Condensed";color:var(--navy)}.stat span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted);font-size:.85rem}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:700;text-transform:uppercase;background:#eee9e0;color:var(--navy)}
.pill.out{background:#fbe9e7;color:var(--brick)}.pill.hid{background:#333;color:#fff}.pill.in{background:#e3f2e8;color:var(--ok)}
label{display:block;font-size:.8rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 5px}
input,textarea,select{width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.check{display:flex;align-items:center;gap:10px;font-size:1rem;margin:10px 0;text-transform:none;color:var(--ink);letter-spacing:0;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--navy)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.toolbar{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:12px}@media(min-width:700px){.toolbar{grid-template-columns:2fr 1fr auto}}
.pcard{display:flex;gap:12px;align-items:flex-start;padding:10px}
.pcard.hidden-p{opacity:.65}
.thumb{width:72px;height:72px;flex:0 0 72px;border-radius:8px;overflow:hidden;background:#ece7de}.thumb img{width:100%;height:100%;object-fit:cover}
.pinfo{flex:1;min-width:0}.pname{font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.price{color:var(--brick);font-weight:700}
.pactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.imgbox{position:relative;width:92px;height:92px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#ece7de}.imgbox img{width:100%;height:100%;object-fit:cover}
.imgbox .ctl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;background:rgba(0,0,0,.65)}
.imgbox .ctl button{background:none;color:#fff;font-size:.95rem;padding:4px 8px}.imgbox .first{position:absolute;top:3px;left:3px;background:var(--gold);color:var(--navy);font-size:.6rem;font-weight:700;padding:1px 5px;border-radius:4px}
.upl{width:92px;height:92px;border:2px dashed var(--navy);border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--navy);font-weight:700;font-size:.8rem;cursor:pointer;text-transform:none;letter-spacing:0;margin:0}
.modal{position:fixed;inset:0;background:rgba(10,16,24,.6);z-index:50;display:none;overflow-y:auto;padding:12px 0}.modal.open{display:block}
.modal .box{background:#fff;max-width:640px;margin:0 auto;border-radius:14px;padding:16px;width:95%}
.box-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.x{width:40px;height:40px;border-radius:50%;background:#f1ece3;font-size:1.3rem}
.sticky-actions{position:sticky;bottom:-12px;background:#fff;padding:12px 0 6px;display:flex;gap:8px;border-top:1px solid var(--line);margin-top:16px}
.login{max-width:420px;margin:50px auto;padding:0 16px}
.err{color:var(--brick);font-size:.9rem;margin-top:8px;min-height:1em}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:999px;font-size:.92rem;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:92vw}.toast.show{opacity:1}
.hlogo{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none}.hlogo img{height:40px;width:auto;display:block}.hlogo span{font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;white-space:nowrap}
.llogo{text-align:center}.llogo img{height:84px;width:auto;margin:0 auto;display:block}.llogo span{display:block;margin-top:10px;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
.demo{background:#fff3cd;color:#664d03;text-align:center;font-size:.85rem;padding:6px}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
</style></head>
<body>
<div id="app"><p class="empty">Loading…</p></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<script src="../assets/config.js"></script>
<script src="../assets/defaults.js"></script>
<script src="../assets/store.js"></script>
<script src="admin.js"></script>
</body></html>
