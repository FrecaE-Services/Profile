<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | Queen16 Beauty Empire</title>
<link rel="icon" href="../assets/favicon.svg">
<meta name="theme-color" content="#10182e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#10182e;--card:#1b2438;--soft:#243049;--gold:#c6a15b;--gold2:#e8d5a4;--text:#f6f1e7;--muted:#b7ad9e;--line:#31405c;--ok:#2ecc71}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--navy);color:var(--text);font-family:Outfit,sans-serif;line-height:1.5;font-size:14px;padding-bottom:48px}
h1,h2,h3{font-family:"Cormorant Garamond",serif;font-weight:600;color:#fff;line-height:1.1}
button,input,select,textarea{font-family:inherit}button{cursor:pointer;border:none}a{color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:rgba(16,24,46,.96);border-bottom:1px solid var(--line);padding:12px 0}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:"Cormorant Garamond",serif;font-size:1.45rem}.brand small{font-family:Outfit;font-size:.68rem;color:var(--gold2);display:block;letter-spacing:.12em;text-transform:uppercase}
.btn{background:var(--gold);color:var(--navy);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.82rem;display:inline-block;text-decoration:none}
.btn.sec{background:var(--soft);color:var(--text);border:1px solid var(--line)}.btn.sm{padding:6px 10px;font-size:.75rem}.btn.danger{background:#6e2c32;color:#fff}
.btn[disabled]{opacity:.5}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:999px;font-size:.8rem}
.tab.on{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);padding:12px;border-radius:8px}.stat b{display:block;font-size:1.35rem;font-family:"Cormorant Garamond",serif}.stat span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.muted{color:var(--muted);font-size:.78rem}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.68rem;font-weight:600;text-transform:uppercase;background:var(--soft);border:1px solid var(--line)}
.pill.new{background:var(--gold);color:var(--navy);border-color:var(--gold)}.pill.confirmed{background:#8a6830}.pill.delivered{background:#1e7d43}.pill.cancelled{background:#444}
label{display:block;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 4px}
input,textarea,select{width:100%;background:#0e1528;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 11px;font-size:.9rem}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold)}
input[type=checkbox]{width:auto;accent-color:var(--gold);transform:scale(1.15);margin-right:6px}
.check{display:flex;align-items:center;font-size:.85rem;margin:8px 0;text-transform:none;color:var(--text);letter-spacing:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.plist .card{display:flex;gap:12px;align-items:center;padding:10px}
.thumb{width:56px;height:70px;flex:0 0 56px;border-radius:6px;overflow:hidden;background:var(--soft)}.thumb img{width:100%;height:100%;object-fit:cover}
.pname{font-weight:600}.price{color:var(--gold2);font-weight:600;font-size:.82rem}.price s{color:var(--muted);font-weight:400;margin-left:4px}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.imgbox{position:relative;width:84px;height:84px;border:1px solid var(--line);border-radius:8px;overflow:hidden}.imgbox img{width:100%;height:100%;object-fit:cover}
.imgbox .ctl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;background:rgba(0,0,0,.7)}
.imgbox .ctl button{background:none;color:#fff;font-size:.8rem;padding:3px 6px}.imgbox .first{position:absolute;top:2px;left:2px;background:var(--gold);color:var(--navy);font-size:.55rem;padding:1px 4px;border-radius:4px}
.upl{width:84px;height:84px;border:1px dashed var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--gold2);font-size:.7rem;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:none;overflow-y:auto;padding:16px 0}.modal.open{display:block}
.modal .box{background:var(--card);max-width:640px;margin:0 auto;border:1px solid var(--line);border-radius:12px;padding:16px;width:94%}
.sticky-actions{position:sticky;bottom:-16px;background:var(--card);padding:12px 0 4px;display:flex;gap:8px;border-top:1px solid var(--line);margin-top:14px}
.login{max-width:400px;margin:60px auto;padding:0 16px}
.err{color:#ff8d8d;font-size:.82rem;margin-top:8px;min-height:1em}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--soft);border:1px solid var(--gold);padding:10px 16px;border-radius:999px;font-size:.82rem;opacity:0;transition:.25s;z-index:99;pointer-events:none}.toast.show{opacity:1}
table{width:100%;border-collapse:collapse;font-size:.8rem}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.items{font-size:.8rem;margin:8px 0;border-top:1px dashed var(--line);padding-top:6px}
.search{margin-bottom:12px}
</style></head>
<body>
<div id="app"></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<script src="../assets/config.js"></script>
<script src="../assets/products.js"></script>
<script src="../assets/store.js"></script>
<script src="admin.js"></script>
</body></html>
