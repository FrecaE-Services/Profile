<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Admin Dashboard | Spare Parts UG</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23d71920%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2252%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22 font-weight=%22bold%22%3ESP%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#101012">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--black:#101012;--card:#1B1B1E;--card-soft:#232327;--red:#E31E24;--red-deep:#B8151A;--steel:#9A9EA4;--text:#F2F1EE;--line:#2E2E33;--ok:#2ecc71}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--black);color:var(--text);font-family:Inter,sans-serif;line-height:1.5;font-size:14px;padding-bottom:60px}
h1,h2,h3{font-family:Rajdhani,sans-serif;text-transform:uppercase;color:#fff;line-height:1.1}
button{font-family:inherit;cursor:pointer;border:none}a{color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:rgba(16,16,18,.97);border-bottom:1px solid var(--line);padding:12px 0}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:Rajdhani;font-size:1.2rem;font-weight:700;text-transform:uppercase}.brand span{color:var(--red)}.brand small{font-family:Inter;font-size:.65rem;color:var(--steel);display:block;text-transform:none;font-weight:500}
.btn{background:var(--red);color:#fff;padding:10px 16px;border-radius:2px;font-weight:600;font-size:.82rem;text-transform:uppercase;display:inline-block;text-decoration:none}
.btn.sec{background:var(--card-soft);border:1px solid var(--line);color:var(--text)}.btn.sm{padding:6px 10px;font-size:.72rem}.btn.danger{background:#5a1214}
.btn[disabled]{opacity:.5}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--steel);padding:8px 14px;border-radius:20px;font-size:.8rem}
.tab.on{background:var(--red);border-color:var(--red);color:#fff}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--red);padding:12px;border-radius:3px}.stat b{display:block;font-size:1.25rem;font-family:Rajdhani}.stat span{font-size:.7rem;color:var(--steel);text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.muted{color:var(--steel);font-size:.78rem}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.68rem;font-weight:700;text-transform:uppercase;background:var(--card-soft);border:1px solid var(--line)}
.pill.new{background:var(--red);border-color:var(--red)}.pill.confirmed{background:#b07a00}.pill.delivered{background:#1e7d43}.pill.cancelled{background:#444}
label{display:block;font-size:.7rem;color:var(--steel);text-transform:uppercase;letter-spacing:.4px;margin:10px 0 4px}
input,textarea,select{width:100%;background:var(--black);border:1px solid var(--line);color:var(--text);border-radius:3px;padding:9px 11px;font-family:inherit;font-size:.9rem}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--red)}
input[type=checkbox]{width:auto;accent-color:var(--red);transform:scale(1.2);margin-right:6px}
.check{display:flex;align-items:center;font-size:.85rem;margin:8px 0;text-transform:none;color:var(--text);letter-spacing:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.plist .card{display:flex;gap:12px;align-items:center;padding:10px}
.thumb{width:56px;height:56px;flex:0 0 56px;border-radius:3px;overflow:hidden;background:var(--card-soft)}.thumb img{width:100%;height:100%;object-fit:cover}
.pname{font-weight:600;font-size:.88rem}.price{color:var(--red);font-weight:700;font-size:.8rem}.price s{color:var(--steel);font-weight:400;margin-left:4px}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.imgbox{position:relative;width:84px;height:84px;border:1px solid var(--line);border-radius:3px;overflow:hidden}.imgbox img{width:100%;height:100%;object-fit:cover}
.imgbox .ctl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;background:rgba(0,0,0,.7)}
.imgbox .ctl button{background:none;color:#fff;font-size:.8rem;padding:3px 6px}.imgbox .first{position:absolute;top:2px;left:2px;background:var(--red);font-size:.55rem;padding:1px 4px;border-radius:2px}
.upl{width:84px;height:84px;border:1px dashed var(--steel);border-radius:3px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--steel);font-size:.7rem;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:none;overflow-y:auto;padding:16px 0}.modal.open{display:block}
.modal .box{background:var(--card);max-width:620px;margin:0 auto;border:1px solid var(--line);border-radius:4px;padding:16px;width:94%}
.sticky-actions{position:sticky;bottom:-16px;background:var(--card);padding:12px 0 4px;display:flex;gap:8px;border-top:1px solid var(--line);margin-top:14px}
.login{max-width:380px;margin:60px auto;padding:0 16px}
.err{color:#ff6b6b;font-size:.82rem;margin-top:8px;min-height:1em}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--card-soft);border:1px solid var(--red);padding:10px 16px;border-radius:3px;font-size:.82rem;opacity:0;transition:.25s;z-index:99;pointer-events:none}.toast.show{opacity:1}
table{width:100%;border-collapse:collapse;font-size:.8rem}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.items{font-size:.8rem;margin:8px 0;border-top:1px dashed var(--line);padding-top:6px}
.search{margin-bottom:12px}
</style></head>
<body>
<div id="app"></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<script src="../assets/config.js"></script>
<script src="../assets/store.js"></script>
<script src="admin.js"></script>
</body></html>
